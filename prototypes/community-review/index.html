function templateEditAction(action,id){const form=$('#template-form'),steps=readTemplateEditor(),key=id?decodeURIComponent(id):null;let next=steps;if(action==='template-mode'){updateTemplateRows(steps);const field=form.elements.steps;field.value=steps.map(step=>step.text).join('\n');field.dataset.base=JSON.stringify(steps);form.dataset.mode=id;$('#template-row-editor').hidden=id!=='rows';$('#template-bulk-editor').hidden=id!=='bulk';$('#template-row-mode').setAttribute('aria-pressed',String(id==='rows'));$('#template-bulk-mode').setAttribute('aria-pressed',String(id==='bulk'));return}if(action==='template-add'){const input=$('#new-template-step'),text=input.value.trim();if(!text)throw Error('请填写要添加的步骤。');next=[...steps,{id:uid(),text}];input.value=''}else if(action==='template-remove')next=steps.filter(step=>step.id!==key);else{const index=steps.findIndex(step=>step.id===key),to=index+(action==='template-up'?-1:1);if(index>=0&&to>=0&&to<steps.length)[next[index],next[to]]=[next[to],next[index]]}updateTemplateRows(next)}
function reconcileSteps(existing,lines){const queues=new Map();for(const step of existing){if(!queues.has(step.text))queues.set(step.text,[]);queues.get(step.text).push(step)}return lines.map(text=>{const previous=queues.get(text)?.shift();return {id:previous?.id||uid(),text}})}
function activate(id){const e=S.events.find(e=>e.id===id&&e.endedAt===null);if(!e)return;if(S.activeId===id){S.page='timer';save();render();return}const now=Date.now();freeze(active(),now);S.activeId=id;e.segments.push({start:now,end:null});S.page='timer';save();render()}
function start(name,extra={}){const now=Date.now();freeze(active(),now);const t=template(name);const e={id:uid(),name,startedAt:now,endedAt:null,segments:[{start:now,end:null}],steps:clone(t.steps),repeatText:t.text,stepDone:{},draft:'',notes:[],source:'操作产生的模拟记录',...extra};S.events.unshift(e);S.activeId=e.id;S.page='timer';U.picker=false;U.newEvent=false;U.candidate=null;save();render();return e}
function pause(){freeze(active(),Date.now());S.activeId=null;save();render()}
function finish(id){const e=S.events.find(e=>e.id===id&&e.endedAt===null);if(!e)return;const now=Date.now();freeze(e,now);e.endedAt=now;if(S.activeId===id)S.activeId=null;if(e.parentId){const p=S.events.find(x=>x.id===e.parentId);if(p&&p.endedAt===null)p.stepDone[e.parentStepId]=true}if(e.knowledge)S.lights.push({id:uid(),eventId:e.id,nodeId:e.knowledge.nodeId,methodId:e.knowledge.methodId,version:e.knowledge.version,confirmed:false,evidence:'',result:'',public:false,created:now});checkFormed(e.habitId||null);save();render();report(e)}
function checkFormed(habitId=S.habitId){const h=S.habits.find(h=>h.id===habitId);if(!h||h.formedAt!==null)return;const counts={};S.events.filter(e=>e.habitId===h.id&&e.endedAt!==null&&e.endedAt<=Date.now()).forEach(e=>{const k=weekKey(e.endedAt);counts[k]=(counts[k]||0)+1});for(const end of Object.keys(counts)){let okay=true;for(let i=0;i<4;i++){const d=new Date(end+'T00:00:00');d.setDate(d.getDate()-7*i);if((counts[dateKey(d)]||0)<5)okay=false}if(okay){h.formedAt=Date.now();break}}}
function candidates(){const now=Date.now(),day=86400000,records=S.events.filter(e=>e.source!=='quick-note'&&e.startedAt<=now),names=[...new Set([...records.map(e=>e.name),...S.habits.map(h=>h.name),'起床','吃东西','喝水','打游戏','写作'])],prior=new Map(names.map(name=>[name,0])),timeline=[];records.forEach((e,index)=>{const age=(now-e.startedAt)/day,decay=Math.exp(-age/90),d=new Date(e.startedAt),today=new Date(now),minutes=Math.abs(today.getHours()*60+today.getMinutes()-d.getHours()*60-d.getMinutes()),clockSimilarity=Math.exp(-Math.min(minutes,1440-minutes)/90),cycle=Math.exp(-Math.abs(age-1)/1.5)+Math.exp(-Math.abs(age-7)/2)+.3*Math.exp(-Math.abs(age-365)/14);prior.set(e.name,prior.get(e.name)+decay*(1+clockSimilarity+cycle));e.segments.forEach((segment,part)=>{if(segment.start<=now)timeline.push({id:e.id,name:e.name,start:segment.start,end:segment.end,index,part})})});timeline.sort((a,b)=>a.start-b.start||b.index-a.index||a.part-b.part);const context=timeline.at(-1)?.name,counts=new Map();for(let i=1;i<timeline.length;i++){const from=timeline[i-1],to=timeline[i];if(from.name!==context||from.id===to.id||from.end===null||from.end>to.start)continue;counts.set(to.name,(counts.get(to.name)||0)+Math.exp(-(now-to.start)/day/90))}const totalPrior=[...prior.values()].reduce((a,b)=>a+b,0),totalTransitions=[...counts.values()].reduce((a,b)=>a+b,0),priorMass=2;return names.map((name,index)=>{const base=totalPrior?prior.get(name)/totalPrior:0;return {name,index,weight:totalTransitions?((counts.get(name)||0)+priorMass*base)/(totalTransitions+priorMass):base}}).sort((a,b)=>b.weight-a.weight||a.index-b.index)}
function navigate(page){S.page=page;const group=['atlas','paths','contribute','governance'].includes(page)?'knowledge':['profile','account'].includes(page)?'space':'habit';U.groups={habit:group==='habit',knowledge:group==='knowledge',space:group==='space'};if(page==='habit')U.habitTree=true;U.picker=false;U.navOpen=false;save();render();window.scrollTo(0,0)}

function stepRow(s,i,e){const child=S.events.find(x=>x.parentId===e?.id&&x.parentStepId===s.id&&x.endedAt===null);return `<div class="step" data-step-id="${s.id}"><label class="check-label"><input type="checkbox" aria-label="完成步骤：${esc(s.text)}" data-change="step-check:${s.id}" ${e?.stepDone[s.id]?'checked':''}></label><input aria-label="步骤 ${i+1}" value="${esc(s.text)}" data-change="step-edit:${s.id}">${btn(child?'切回子任务':'开始子任务',`child:${s.id}`,'',`aria-label="${child?'切回':'开始'}子任务：${esc(s.text)}"`)}${btn('×','step-remove:'+s.id,'remove',`aria-label="移除步骤：${esc(s.text)}"`)}</div>`}
function title(title,desc,action=''){return `<div class="titlebar"><div class="row between"><h1 data-od-id="page-heading">${title}</h1>${action}</div><p class="muted">${desc}</p></div>`}
function habitWeeks(h){const end=new Date(weekKey(Date.now())+'T00:00:00');return [3,2,1,0].map(i=>{let d=new Date(end);d.setDate(d.getDate()-7*i);const k=dateKey(d),count=S.events.filter(e=>e.habitId===h.id&&e.endedAt!==null&&e.endedAt<=Date.now()&&weekKey(e.endedAt)===k).length;return {key:k,count}})}
function weeks(h){return `<div class="week-grid">${habitWeeks(h).map((w,i)=>`<div class="week-cell"><div class="muted small">${i===3?'本周':w.key.slice(5)+' 起'}</div><div style="margin-top:10px"><span class="num">${w.count}</span><span class="muted"> / 5 次</span></div><div class="progress" style="--value:${Math.min(100,w.count/5*100)}%"><i></i></div></div>`).join('')}</div>`}
function habitsPage(){const h=currentHabit();return title('一次，养成一个习惯','连续四周，每周坚持五次。按次数记录，同一天的多次实践也计入。',btn('新建习惯','new-habit','primary'))+`<div class="box" data-od-id="current-habit"><div class="row between"><div><span class="tag ${h.formedAt!==null?'success':''}">${habitStatus(h)}</span><h2 style="margin-top:12px">${esc(h.name)}</h2></div>${btn(S.events.some(e=>e.habitId===h.id&&e.endedAt===null)?'继续这次实践':'从当前习惯开始','begin-habit:'+h.id)}</div>${weeks(h)}<p class="small muted">十五分钟是建议，不是截止时间。切换养成目标不会改变正在计时的事。</p></div><div class="row between" style="margin:32px 0 18px"><h2>保留每一段积累</h2><span class="small muted">${S.habits.length} 个习惯定义</span></div><div class="habit-grid">${S.habits.map(x=>`<article class="habit-card ${x.id===h.id?'current':''}" data-od-id="habit-${x.id}"><span class="tag ${x.formedAt!==null?'success':''}">${habitStatus(x)}${x.demo?' · 模拟养成示例':''}</span><h2>${esc(x.name)}</h2><p class="small muted">${x.demo?'展示已养成后的状态，未添加虚构实践记录。':S.events.filter(e=>e.habitId===x.id&&e.endedAt!==null).length+' 次已结束实践 · ID 保持不变'}</p><div class="row">${x.id!==h.id?btn(x.formedAt!==null?'选为当前实践习惯':'切换养成目标','switch-habit:'+x.id):'<span class="small muted">当前选择</span>'}${btn('修改名称','rename-habit:'+x.id,'ghost')}</div>${x.formedAt!==null?`<details><summary style="padding:15px 0;min-height:44px;cursor:pointer">展开已养成习惯</summary><p class="small muted">连续四周，每周五次${x.demo?'（状态演示）':''}。养成后保留状态。</p>${btn('查看该习惯详情','habit-detail:'+x.id,'ghost')}</details>`:''}</article>`).join('')}</div>`}
function habitPage(){const h=S.habits.find(h=>h.id===(U.habitDetail||S.habitId))||currentHabit(),t=template(h.name);return title(esc(h.name),'习惯详情 · 重复定义、养成进度与关联实践')+`<span class="tag">${habitStatus(h)}${h.demo?' · 模拟示例':''}</span>${weeks(h)}<div class="two"><section class="box"><div class="row between"><h2>每次复用</h2>${btn('编辑定义','edit-template:'+encodeURIComponent(h.name),'ghost')}</div><p class="pre" style="margin-top:18px">${esc(t.text)||'尚未添加重复说明。'}</p><ol>${t.steps.map(s=>`<li>${esc(s.text)}</li>`).join('')}</ol><p class="footnote">只编辑复用定义，单次笔记在具体事件里。</p></section><section class="box"><h2>实践历史</h2>${S.events.filter(e=>e.habitId===h.id&&e.endedAt!==null).map(record).join('')||'<p class="muted" style="margin-top:20px">还没有关联的已结束实践。</p>'}</section></div>`}
function historyEvents(){let a=new Date((U.range==='today'?dateKey(Date.now()):U.date)+'T00:00:00'),b=new Date(a);if(U.range==='week'){a=new Date(weekKey(a)+'T00:00:00');b=new Date(a);b.setDate(b.getDate()+7)}else if(U.range==='month'){a.setDate(1);b=new Date(a);b.setMonth(b.getMonth()+1)}else b.setDate(b.getDate()+1);return S.events.filter(e=>e.endedAt!==null&&(U.range==='all'||e.endedAt>=+a&&e.endedAt<+b)).sort((a,b)=>b.endedAt-a.endedAt)}
function record(e){if(S.settings.historyLock&&!S.user.example)return `<article class="record-row" data-record-id="${e.id}" data-od-id="record-${e.id}"><div class="record-icon">${icon('records')}</div><div><h3>${esc(e.name)}</h3><p class="small muted">${dt(e.endedAt)} · 本次笔记已锁定</p>${btn('验证并查看详情','event-detail:'+e.id,'ghost')}</div><time class="record-duration">${clock(elapsed(e))}</time></article>`;return `<article class="record-row" data-record-id="${e.id}" data-od-id="record-${e.id}"><div class="record-icon">${icon(e.knowledge?'atlas':e.habitId?'habit':'timer')}</div><div><h3>${esc(e.name)}</h3><p class="small muted">${dt(e.endedAt)} · ${e.parentId||e.parentOrigin||e.parentMissing?'子任务':e.habitId?'习惯实践':e.knowledge?'知识实践':'自由事件'}</p><details><summary>${e.notes.length?'单次笔记 '+e.notes.length+' 条':'活动区间与详情'}</summary>${e.notes.map(n=>`<p class="pre">${esc(n.text)}</p>`).join('')}${e.draft?`<p class="pre muted">未保存草稿：${esc(e.draft)}</p>`:''}<p>${e.segments.length} 个实际活动区间</p>${btn('查看事件详情','event-detail:'+e.id,'ghost',`aria-label="查看事件详情：${esc(e.name)}"`)}</details><span class="small muted">操作产生的模拟记录</span></div><time class="record-duration">${clock(elapsed(e))}</time></article>`}
function recordsPage(){const rows=historyEvents(),total=rows.reduce((n,e)=>n+elapsed(e),0);return title('时间留下的痕迹','每一条记录，只计算真正活动的时间。自由事件、习惯实践和子任务都在这里。')+`<div class="history-layout"><section><div class="filters" aria-label="历史范围">${[['today','今日'],['day','指定日'],['week','周'],['month','月'],['all','全部']].map(([k,l])=>btn(l,'range:'+k,U.range===k?'selected':'',`aria-pressed="${U.range===k}"`)).join('')}</div>${!['all','today'].includes(U.range)?`<label class="field small" style="margin-top:15px;max-width:220px">选择日期<input type="date" aria-label="历史日期" value="${U.date}" data-change="history-date"></label>`:''}<div class="statline"><div><div class="num">${rows.length}</div><span class="muted small">已结束事件</span></div><div><div class="num" style="font-size:25px">${clock(total)}</div><span class="muted small">实际累计用时</span></div><div><div class="num">${rows.reduce((n,e)=>n+e.notes.length,0)}</div><span class="muted small">留下的笔记</span></div></div>${durationChart(rows)}<div aria-label="历史事件列表">${rows.map(record).join('')||'<div class="empty">这个范围还没有已结束记录。<br><span class="small">完成一段行动后，就会留下痕迹。</span></div>'}</div></section><aside class="box history-calendar"><div class="row between"><h3>${U.date.slice(0,7).replace('-',' 年 ')} 月</h3><div>${btn('‹','calendar-prev','ghost','aria-label="上一个月"')}${btn('›','calendar-next','ghost','aria-label="下一个月"')}</div></div>${calendar()}<p class="footnote">有记录的日期下方带圆点。点击查看当日。</p><hr class="divider"><p class="small muted">数据来源：本浏览器的实际模拟操作。没有预填计时时长。</p></aside></div>`}
function calendar(){const d=new Date(U.date+'T00:00:00'),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1),count=new Date(year,month+1,0).getDate();return `<div class="calendar">${'一二三四五六日'.split('').map(x=>`<span class="small muted" style="text-align:center">${x}</span>`).join('')}${'<span></span>'.repeat((first.getDay()+6)%7)}${Array.from({length:count},(_,i)=>{const k=dateKey(new Date(year,month,i+1)),has=S.events.some(e=>e.endedAt!==null&&dateKey(e.endedAt)===k);return btn(i+1,'calendar:'+k,`${has?'has-event':''} ${k===U.date&&U.range==='day'?'selected':''}`,`aria-label="查看 ${k} 的记录"`)}).join('')}</div>`}
function durationChart(rows){if(!rows.length)return '';const groups={};for(const e of rows){const k=dateKey(e.endedAt);groups[k]=(groups[k]||0)+elapsed(e)}const data=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])),max=Math.max(1,...data.map(d=>d[1]));return `<section class="duration-chart" data-od-id="time-trend" aria-label="按结束日期统计的实际用时"><h3>每日实际用时</h3><div class="chart-rows" style="--max:${max}">${data.map(([k,v])=>`<div class="bar-row"><time>${k.slice(5)}</time><div class="bar-track"><div class="bar" style="--v:${v}"></div></div><time>${clock(v)}</time></div>`).join('')}</div><p class="footnote">按事件结束日期归档，长度由实际活动毫秒计算；零用时不绘制虚假柱长。</p></section>`}
function eventBody(e){return `<div class="statline"><div><div class="num" style="font-size:28px">${clock(elapsed(e))}</div><span class="small muted">实际用时</span></div><div><div class="num">${e.segments.length}</div><span class="small muted">活动区间</span></div><div><div class="num">${e.steps.filter(s=>e.stepDone[s.id]).length}/${e.steps.length}</div><span class="small muted">完成步骤</span></div></div><h3>活动时间段</h3>${e.parentMissing?`<p class="small muted">原来源记录暂不可用。来源 ID：${esc(e.parentMissing.id)}；未推断来源名称或删除原因。</p>`:''}${e.parentOrigin?`<p class="small muted">父记录「${esc(e.parentOrigin.name)}」已删除；这次子任务独立保留。</p>`:''}${e.importRecovery?.cutoff===null?`<p class="small muted">备份缺少导出时刻，开放区间未计入用时。原起点：${dt(e.importRecovery.openStart)}。</p>`:''}<div class="list">${e.segments.map(s=>`<p class="list-row mono small">${dt(s.start)} → ${s.end!==null?dt(s.end):'正在计时'}</p>`).join('')}</div>${e.steps.length?`<hr class="divider"><h3>本次步骤</h3><ul>${e.steps.map(s=>`<li>${e.stepDone[s.id]?'✓':'○'} ${esc(s.text)}</li>`).join('')}</ul>`:''}<details class="saved-notes" data-od-id="repeat-snapshot"><summary>当时的重复说明</summary>${typeof e.repeatText==='string'?`<p class="pre">${esc(e.repeatText)||'当时没有填写重复说明。'}</p>`:'<p class="small muted">这条旧记录未保存重复说明快照。</p>'}</details><hr class="divider"><h3>本次单次笔记</h3>${e.notes.map(n=>`<p class="pre" style="margin-top:14px">${esc(n.text)}<br><span class="small muted">${dt(n.at)}</span></p>`).join('')||'<p class="muted small" style="margin-top:12px">没有已保存的笔记。</p>'}${e.draft?`<p class="pre muted" style="margin-top:15px">未保存草稿：${esc(e.draft)}</p>`:''}${e.knowledge?`<hr class="divider"><h3>知识实践快照</h3><p>${esc(e.knowledge.nodeTitle)} · ${esc(e.knowledge.methodTitle)}${e.knowledge.version!=null?' v'+esc(e.knowledge.version):''}</p><details class="saved-notes" data-od-id="knowledge-snapshot"><summary>查看当时目标与起步建议</summary><h3>完整目标${e.knowledge.nodeVersion!=null?' · v'+esc(e.knowledge.nodeVersion):''}</h3><p class="pre">${esc(e.knowledge.nodeGoal)||'这条旧记录未保存完整目标。'}</p><h3 style="margin-top:16px">五分钟起步建议</h3><p class="pre">${esc(e.knowledge.five)||'当时没有起步建议。'}</p></details><details class="saved-notes"><summary>查看当时方法</summary><p class="pre">${esc(e.knowledge.content)||'独立尝试，未选择教程。'}</p>${methodResourceDisplay(e.knowledge)}${e.knowledge.resource?`<p class="pre small">当时资料地址：${esc(e.knowledge.resource)}</p>`:''}</details><p class="small muted">教程后续修改，不会改变这次实践的快照。</p>`:''}<p class="footnote mono">事件 ID：${e.id}</p>`}
function eventPage(){const e=S.events.find(e=>e.id===U.eventId&&e.endedAt!==null);if(e&&S.settings.historyLock&&!S.user.example&&U.unlockedEvent!==e.id)return title('事件详情','本次历史需要验证模拟密码，计时不受影响。')+btn('验证并查看','event-detail:'+e.id);if(!e)return title('事件详情','请从历史记录中选择一次事件。')+btn('前往事件记录','nav:records');return title(esc(e.name),'事件详情 · 只描述这一次实际行动',btn('返回事件记录','nav:records','ghost'))+`<section class="box">${eventBody(e)}<hr class="divider"><div class="row">${btn('调整本次笔记','edit-event-note:'+e.id)}${btn('删除本次记录','delete-event:'+e.id,'ghost danger')}</div></section>`}
function node(id=U.node){return S.nodes.find(n=>n.id===id)||S.nodes[0]}
function graphMatches(n){const query=U.graphQuery.trim().toLocaleLowerCase();return (U.domain==='all'||n.domain===U.domain)&&(!query||`${n.title} ${n.goal} ${n.branch} ${n.domain}`.toLocaleLowerCase().includes(query))}
function graphEmpty(){return `<div class="atlas-empty"><h3>没有找到匹配目标</h3><p class="small muted">可以换个词，或切换领域继续查找。</p><div class="row">${U.graphQuery.trim()?btn('清除搜索','clear-graph-search'):''}${U.domain!=='all'?btn('显示全部领域','graph-all-domains'):''}</div></div>`}
function refreshAtlas(){const vp=$('#atlas-viewport');if(!vp)return;vp.innerHTML=graph();vp.scrollLeft=0;vp.scrollTop=0;bind(vp);bindGraph();const detail=$('#node-detail');detail.innerHTML=nodeDetail();bind(detail);const count=S.nodes.filter(graphMatches).length;vp.classList.toggle('is-empty',count===0);const status=$('#atlas-result-status');status.textContent=`找到 ${count} 个目标`;status.hidden=!U.graphQuery.trim()&&U.domain==='all';document.querySelectorAll('[data-action^="zoom-"]').forEach(button=>button.disabled=count===0)}
function focusAtlasNode(focus=true){const vp=$('#atlas-viewport'),target=vp?.querySelector('.graph-node.selected');if(!target)return;const r=target.getBoundingClientRect(),v=vp.getBoundingClientRect(),dx=r.left<v.left+12?r.left-v.left-12:r.right>v.right-12?r.right-v.right+12:0,dy=r.top<v.top+12?r.top-v.top-12:r.bottom>v.bottom-12?r.bottom-v.bottom+12:0;vp.scrollLeft+=dx;vp.scrollTop+=dy;if(focus)target.focus({preventScroll:true})}
function knowledgeDomains(){return [...new Set(S.nodes.map(n=>n.domain))]}
function graphLayout(){const domains=knowledgeDomains();const positions={};let y=42;domains.forEach(d=>{const ns=S.nodes.filter(n=>n.domain===d&&graphMatches(n));if(!ns.length)return;ns.forEach((n,i)=>positions[n.id]={x:170+(i%5)*174,y:y+Math.floor(i/5)*82});y+=Math.ceil(ns.length/5)*82+60});return {positions,height:Math.max(600,y)}}
function graph(){const {positions:pos,height}=graphLayout();const visible=S.nodes.filter(n=>pos[n.id]&&graphMatches(n));if(!visible.length)return graphEmpty();const ids=new Set(visible.map(n=>n.id));const lines=S.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)).map(e=>{const a=pos[e.from],b=pos[e.to],x=a.x+155,y=a.y+28,z=b.x,w=b.y+28;return `<path class="${e.type==='instance'?'instance':''}" d="M ${x} ${y} C ${x+35} ${y},${z-35} ${w},${z} ${w}" ${e.type==='prereq'?'marker-end="url(#arrow)"':''}/>`}).join('');let labels=[];for(const n of visible)if(!labels.some(a=>a.domain===n.domain))labels.push({domain:n.domain,y:pos[n.id].y});return `<div class="graph-inner" id="graph-inner" style="height:${height}px;transform:scale(${U.zoom})"><svg class="graph-lines" style="height:${height}px" viewBox="0 0 1090 ${height}" aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" style="fill:var(--control-border);stroke:none"/></marker></defs>${lines}</svg>${labels.map(d=>`<span class="graph-domain" style="top:${d.y}px">${d.domain}</span>`).join('')}${visible.map(n=>btn(`${esc(n.title)}<small>${esc(n.branch)}${n.ownership==='personal'?' · 私人':''}</small>`,'node:'+n.id,`graph-node ${n.id===U.node?'selected':''} ${S.lights.some(l=>l.nodeId===n.id&&l.confirmed)?'lit':''}`,`style="left:${pos[n.id].x}px;top:${pos[n.id].y}px" aria-label="知识节点：${esc(n.title)}" aria-pressed="${n.id===U.node}" data-od-id="node-${n.id}"`)).join('')}</div>`}
function atlasPage(){const count=S.nodes.filter(graphMatches).length;return title('知识图谱','选择一个目标，查看方法，再开始实践。')+`<div class="atlas-layout"><section><div class="atlas-panel" data-od-id="knowledge-atlas"><div class="atlas-tools"><div class="row"><select aria-label="知识领域" data-change="domain"><option value="all">全部领域</option>${knowledgeDomains().map(d=>`<option value="${esc(d)}" ${U.domain===d?'selected':''}>${esc(d)}</option>`).join('')}</select><input type="search" id="graph-search" aria-label="搜索知识节点" placeholder="搜索目标或概念" value="${esc(U.graphQuery)}"></div><div class="row">${btn('−','zoom-out','','aria-label="缩小图谱"'+(!count?' disabled':''))}<span class="small mono" id="zoom-label">${Math.round(U.zoom*100)}%</span>${btn('＋','zoom-in','','aria-label="放大图谱"'+(!count?' disabled':''))}${btn('适配','zoom-fit','ghost','aria-label="适配图谱"'+(!count?' disabled':''))}</div></div><p id="atlas-result-status" class="small muted atlas-result-status" role="status" ${!U.graphQuery.trim()&&U.domain==='all'?'hidden':''}>找到 ${count} 个目标</p><div class="atlas-viewport${count?'':' is-empty'}" id="atlas-viewport" tabindex="0" aria-label="知识图谱画布，可拖动和滚动探索">${graph()}</div><div class="legend"><span class="legend-item"><i class="legend-line"></i>→ 推荐前置 / 后置</span><span class="legend-item"><i class="legend-line dashed"></i>实例 / 原理</span><span class="legend-item"><i class="legend-light"></i>我的确认点亮</span></div></div><p class="footnote">${S.nodes.length} 个演示目标，${S.edges.length} 条知识关系。</p><div class="path-strip"><span class="small muted">探索路径</span>${S.paths.slice(0,3).map(p=>btn(esc(p.title),'path-open:'+p.id)).join('')}</div></section><aside class="node-detail" id="node-detail" data-od-id="node-details">${nodeDetail()}</aside></div>`}
function nodeDetail(){const n=node();if(!n||!graphMatches(n))return '<div class="node-placeholder"><h2>选择一个目标</h2><p class="small muted">点击图谱中的目标，再查看方法和下一步实践。</p></div>';const lit=S.lights.filter(l=>l.nodeId===n.id&&l.confirmed),methods=n.methods;return `<div class="node-heading"><span class="tag">${esc(n.domain)} / ${esc(n.branch)}</span><h2>${esc(n.title)}</h2><span class="small muted">${n.ownership==='group'?'公共节点 · 属于全部点亮者':'私人节点 · 由你持有'} · 目标 v${n.version}</span></div><div><section class="goal"><h3>要达成的目标</h3><p>${esc(n.goal)}</p><p class="small muted">自证提示：留下一个过程、结果或自己的解释。</p></section><div class="small muted">${lit.length} 次本人确认点亮 · ${S.lights.filter(l=>l.nodeId===n.id&&!l.confirmed).length} 个待确认草稿</div></div><section><h3>方法与教程 <span class="muted small">${methods.length} 份</span></h3><p class="small muted">先试试，需要时再展开。</p>${methods.map(m=>{const v=m.versions.at(-1);return `<details class="method" data-method-id="${m.id}" ${U.method===m.id?'open':''}><summary>${esc(m.title)}<br><span class="small muted">${esc(m.author)} · v${v.number} · ${m.visibility==='public'?'公开演示':'私人草稿'}</span></summary><div class="method-body"><p class="pre">${esc(v.content)}</p><div class="five"><h3 class="small">下一段五分钟</h3><p>${esc(v.five)}</p></div>${methodResourceDisplay(v)}${v.resource?`<p class="pre small">资料 / 产品地址：${esc(v.resource)}<br>仅文本审阅，未接渠道或归因。</p>`:''}${btn('选择这个方法','select-method:'+m.id,'',`aria-pressed="${U.method===m.id}"`)}<details style="margin-top:14px"><summary style="padding:8px 0">版本历史（${m.versions.length}）</summary>${m.versions.map(v=>methodVersionBody(v,m)).join('')}</details></div></details>`}).join('')}${btn(U.method?'使用所选方法去实践':'独立尝试 · 进入计时','practice','primary')}<div class="row" style="margin-top:15px">${btn('贡献方法','contribute-node','ghost')}${btn('卡点与求助','node-help','ghost')}</div><p class="footnote">五分钟是起步建议，完整目标保留。结束计时仅生成草稿，不等于已掌握。</p></section><details class="relations related-fold"><summary>相关目标与知识关系</summary><div class="related-links">${S.edges.filter(e=>e.to===n.id||e.from===n.id).map(e=>{const other=node(e.from===n.id?e.to:e.from);return btn(`${e.type==='instance'?'实例 / 原理':e.to===n.id?'推荐前置':'推荐后置'} · ${esc(other.title)}`,'node:'+other.id,'ghost')}).join('')||'<p class="muted">暂未建立知识关系。</p>'}</div></details>`}
function pathsPage(){return title('路，是一步步走出来的',`路径给出顺序建议，不限制自由选择。${S.user?.reviewService?'私人路径与收藏随账号保存，断线编辑可重试。':'默认只保存到本地。'}`,btn('创建自己的路径','new-path','primary'))+`<div class="row" style="margin-bottom:18px">${btn('全部路径','path-filter:all','ghost',`aria-pressed="${U.pathFilter!=='saved'}"`)}${btn('已收藏','path-filter:saved','ghost',`aria-pressed="${U.pathFilter==='saved'}"`)}</div>`+(U.pathFilter==='saved'&&!S.paths.some(p=>p.bookmarked)?'<p class="small muted">还没有收藏路径。收藏后可以在这里继续探索。</p>':'')+S.paths.filter(p=>U.pathFilter!=='saved'||p.bookmarked).map(p=>`<article class="path-card" data-od-id="path-${p.id}"><div class="row between"><h2>${esc(p.title)}</h2><span class="tag">${p.seed?'演示路径':p.visibility==='public'?'公开模拟':'私人路径'}</span></div><p class="small muted" style="margin:10px 0">${p.nodes.filter(id=>S.lights.some(l=>l.nodeId===id&&l.confirmed)).length} / ${p.nodes.length} 个目标有本人确认记录</p><div class="path-strip">${p.nodes.map((id,i)=>`${i?'<span class="muted">→</span>':''}${btn(`${S.lights.some(l=>l.nodeId===id&&l.confirmed)?'✓ ':''}${esc(node(id).title)}`,'node-nav:'+id)}`).join('')}</div><div class="row" style="margin-top:15px">${btn(p.bookmarked?'取消收藏':'收藏路径','path-bookmark:'+p.id,'ghost',`aria-pressed="${!!p.bookmarked}"`)}${btn('复制为我的路径','fork-path:'+p.id,'ghost')}${!p.seed?btn('编排路径','edit-path:'+p.id,'ghost')+btn(p.visibility==='public'?'撤回公开模拟':'选择公开此路径','share-path:'+p.id,'ghost'):''}</div></article>`).join('')}
function contributePage(){const own=S.nodes.filter(n=>n.ownership==='personal'),ms=S.nodes.flatMap(n=>n.methods.filter(m=>m.author===S.user.name).map(m=>({n,m})));return title('把做过的方法，留下来','教程贡献与私人目标在这里。公开需要主动选择，版本变化有迹可循。',btn('创建私人节点','new-node','primary'))+`<div class="two"><section class="box"><h2>我的私人目标</h2>${own.map(n=>`<article class="list-row"><h3>${esc(n.title)}</h3><p class="small muted">${n.visibility==='public'?'公开模拟':'仅自己可见'} · 个人持有 · 目标 v${n.version}</p><div class="row" style="margin-top:10px">${btn('探索目标','node-nav:'+n.id)}${btn('修订目标','edit-node:'+n.id,'ghost')}${btn(n.visibility==='public'?'撤回公开':'选择公开','share-node:'+n.id,'ghost')}</div>${n.versions?.length?`<details class="saved-notes" data-node-versions="${esc(n.id)}"><summary>目标修订记录（${n.versions.length} 个旧版本）</summary>${n.versions.map(v=>`<article class="list-row"><h3>v${v.version} · ${esc(v.title)}</h3>${v.domain?`<p class="small muted">${esc(v.domain)} / ${esc(v.branch)}</p>`:''}<p class="pre small">${esc(v.goal)}</p><p class="pre small muted">五分钟起步：${esc(v.five)}</p></article>`).join('')}</details>`:''}</article>`).join('')||'<p class="muted" style="margin-top:18px">暂未创建私人目标。公共节点不会归为作者私产。</p>'}</section><section class="box"><h2>我的教程与版本</h2>${ms.map(({n,m})=>`<article class="list-row"><h3>${esc(m.title)}</h3><p class="small muted">${esc(n.title)} · v${m.versions.at(-1).number} · ${m.visibility==='public'?'公开模拟':'私人保存'}</p><div class="row" style="margin-top:10px">${btn('修订新版本','edit-method:'+n.id+':'+m.id)}${btn(m.visibility==='public'?'撤回公开':'选择公开','share-method:'+n.id+':'+m.id,'ghost')}</div><details class="saved-notes"><summary>审阅全部版本（${m.versions.length}）</summary>${m.versions.map(v=>methodVersionBody(v,m)).join('')}</details></article>`).join('')||'<p class="muted" style="margin-top:18px">先实践并确认点亮，再贡献方法。未点亮时可保存私人草稿。</p>'}</section></div><hr class="divider"><h2>点亮草稿与自证</h2>${lightsList(false)}`}
function lightSnapshot(l){return S.events.find(e=>e.id===l.eventId)?.knowledge}
function lightTitle(l){return lightSnapshot(l)?.nodeTitle||S.nodes.find(n=>n.id===l.nodeId)?.title||'原目标已不在当前图谱'}
function lightsList(onlyConfirmed=false){const ls=S.lights.filter(l=>!onlyConfirmed||l.confirmed);return ls.map(l=>`<article class="list-row" data-light-id="${l.id}" data-od-id="light-${l.id}"><div class="row between"><h3>${esc(lightTitle(l))}</h3><span class="tag ${l.confirmed?'success':''}">${l.confirmed?'本人确认 · L1 自证':'待确认草稿'}</span></div><p class="small muted">${dt(l.created)} · ${l.methodId?'方法 v'+l.version:'独立尝试'} · ${l.public?'公开模拟':'仅自己可见'}</p>${l.result?`<p class="pre">结果：${esc(l.result)}</p>`:''}${l.evidence?`<p class="pre">证据：${esc(l.evidence)}</p>`:''}<div class="row" style="margin-top:12px">${!l.confirmed?btn('自证并确认点亮','confirm-light:'+l.id):btn(l.public?'撤回公开':'选择公开证据','share-light:'+l.id,'ghost')}${btn('查看实践记录','event-detail:'+l.eventId,'ghost')}</div></article>`).join('')||'<div class="empty" style="margin-top:20px">知识实践结束后，草稿会出现在这里。确认由你决定。</div>'}
function profilePage(){const done=S.events.filter(e=>e.endedAt!==null);return `<header class="profile-head" data-od-id="profile-heading"><div class="avatar">${esc(S.user.name.slice(0,1))}</div><div><span class="eyebrow">我的实践档案</span><h1 style="margin:8px 0">${esc(S.user.name)}</h1><p class="small muted">${esc(S.bio)}</p></div></header><div class="statline"><div><div class="num">${done.length}</div><span class="muted small">实际模拟操作</span></div><div><div class="num">${S.lights.filter(l=>l.confirmed).length}</div><span class="muted small">本人确认点亮</span></div><div><div class="num">${S.nodes.flatMap(n=>n.methods.filter(m=>m.author===S.user.name)).length}</div><span class="muted small">贡献的方法</span></div></div><div class="two"><section><div class="row between section-head"><h2>知识足迹</h2>${btn('账户入口','nav:account','ghost')}</div><div class="footprint">${[...new Set(S.lights.filter(l=>l.confirmed).map(l=>l.nodeId))].map(id=>btn(esc(node(id).title),'node-nav:'+id)).join('')||'<p class="muted">尚未确认点亮。做过之后，再留下自己的证明。</p>'}</div><div style="margin-top:28px">${lightsList()}</div></section><section><h2 class="section-head">个人实践时间线</h2><div class="timeline">${done.map(e=>`<article class="list-row"><p class="small muted">${dt(e.endedAt)}</p><h3>${esc(e.name)}</h3><p class="small muted">${clock(elapsed(e))} · ${e.knowledge?'关联知识实践':'行动记录'}</p>${btn('查看这一次','event-detail:'+e.id,'ghost')}</article>`).join('')||'<p class="muted">还没有已结束的实践。</p>'}</div></section></div>`}
function governancePage(){return title('由点亮者，共同维护','公共节点归全部点亮者。这里的提案、投票与问题记录都是本地模拟，不产生远程治理结果。',btn('发起提案','new-proposal','primary'))+`<div class="two"><section class="box"><h2>提案与审阅</h2>${S.proposals.map(p=>`<article class="list-row" data-proposal-id="${p.id}"><span class="tag">${esc(p.type)} · 本地模拟</span><h3 style="margin-top:10px">${esc(p.title)}</h3><p class="pre small">${esc(p.body)}</p><p class="small muted">目标：${esc(node(p.nodeId).title)} · 状态：${esc(p.status||'开放审阅')} · ${dt(p.created)}</p><div class="row" style="margin-top:12px">${btn('赞成','vote:'+p.id+':yes','',`aria-pressed="${p.vote==='yes'}"`)}${btn('反对','vote:'+p.id+':no','',`aria-pressed="${p.vote==='no'}"`)}${btn('撤回投票','vote:'+p.id+':none','ghost')}</div><p class="footnote">本人的 ${p.vote==='yes'?'赞成':p.vote==='no'?'反对':'未投票'}记录；无其他居民票数，不自动通过。</p></article>`).join('')||'<div class="empty" style="margin-top:18px">没有提案。可审阅下方规则，再发起本地模拟提案。</div>'}</section><section class="box"><div class="row between"><h2>问题与求助</h2>${btn('记录问题','new-issue','ghost')}</div>${S.issues.map(i=>`<article class="issue"><span class="tag">${esc(i.type)} · ${i.closed?'已关闭':'待处理'}</span><h3 style="margin-top:9px">${esc(i.title)}</h3><p class="pre small">${esc(i.body)}</p><p class="footnote">${i.type==='红线举报'?'不公开，模拟内部审阅':'仅本地记录，没有通知他人'}</p>${btn(i.closed?'重新打开':'关闭问题','issue-close:'+i.id,'ghost')}</article>`).join('')||'<p class="muted" style="margin-top:20px">卡点、求助、复现问题与协议意见分流记录。</p>'}</section></div><div class="box" style="margin-top:24px"><h2>长期机制 · 保留并可审阅</h2><div class="rule-block"><h3>持有、捐赠与维护</h3><p>私人节点归个人；公共节点归全部点亮者，作者与维护者没有独占持有权。私人节点可自愿捐赠，也可提出转群体持有提案；群体节点不可私有化。</p><p>个人维护自己的节点；公共节点由点亮者维护，重大修改走提案。长期无人维护的节点可休眠、归档并被接管。</p></div><div class="rule-block"><h3>分裂与合并</h3><p>分裂保留原节点，新增更小的实践目标，以分裂说明保留路径关系。明确选边者进入新节点，未表态者留在原节点；作者可以认领自己的教程。</p><p>合并用于同一目标、不同方法。保留教程多样性与点亮记录并集；私人并入公共必须本人自愿，保留教程作者权。收费历史方案已被完整免费规则替代。</p></div><div class="rule-block"><h3>试点投票与蒙尘</h3><p>未蒙尘点亮者一人一票；六个月窗口、至少三人及三分之二赞成是详细文件中的试点建议，原型不捏造法定人数或自动执行结构变更。点亮是证据事件，可重复实践；久未实践可提示回顾，不撤销历史证据。</p></div><div class="rule-block"><h3>同侪问题层与信任</h3><p>默认 L1 自证，机器验证与他证为可选扩展。教程先折叠，公开贡献前需首次点亮；收录与质量靠同侪复现和反馈。绿线需要说明、黄线无法复现、红线内部审阅（每个本地账户三个额度）。悬赏是问题的一类，验收由本人决定；此处没有付款或真实通知。</p></div><div class="rule-block"><h3>本地优先、联邦与协议</h3><p>未来保留内容寻址与不可变版本、跨树链接、社区自托管、异步同步、冲突分叉与显式选择，以及 MCP、插件、Android 与桌面客户端路线。本次网页只实现本地模拟，不冒充联邦交换或真实签名。</p></div><div class="rule-block"><h3>研究共享与反馈</h3><p>匿名聚合、脱敏个体与实名共享分别授权，默认关闭，可撤回。未成年人只能在监护同意后参与匿名聚合。内容意见进入节点问题，产品体验进入反馈，规范意见进入协议提案；没有默认收集或上传。</p></div></div>`}
function accountPage(){return title('账户与设置','你决定什么留在这里、什么可以共享。所有开关均为本地模拟。')+`<div class="two"><section class="box"><div class="row between"><h2>我的账户</h2><span class="tag">${S.user.example?'示例模式':'模拟名字 / 密码'}</span></div><p style="margin:18px 0">${esc(S.user.name)}</p><form id="profile-form" class="stack"><label class="field">个人介绍<textarea name="bio" aria-label="个人介绍">${esc(S.bio)}</textarea></label><button>保存个人介绍</button></form><div class="row" style="margin-top:20px">${btn('修改模拟密码','change-password','ghost')}${btn('退出登录','logout','ghost')}</div><p class="footnote">仅本机认证，不是生产安全账户。退出时冻结活动段，未结束记录保留。</p></section><section class="box"><h2>数据留在你手中</h2><p class="small muted" style="margin-top:14px">备份包含自己的事件、习惯、知识、教程版本和自证。不包含登录密码。导入前审阅数量，不静默覆盖。</p><div class="row" style="margin-top:20px">${btn('选择并导出数据','export-data')}${btn('导入本地备份','import-data')}</div><input type="file" id="import-file" accept="application/json,.json" hidden><p class="small muted" style="margin-top:20px">同步：未连接。没有真实服务器，所有保存均在本浏览器。</p>${loadError?`<p class="error">${loadError}</p>`:''}</section><section class="box"><h2>分享与研究授权</h2><p class="small muted" style="margin:14px 0">默认关闭，开启只保存模拟意愿，不上传数据。</p>${[['aggregate','匿名聚合数据'],['individual','脱敏个人实践'],['named','实名数据（仅成人，需研究用途审批）']].map(([k,l])=>`<label class="check-row"><input type="checkbox" data-change="share:${k}" ${S.share[k]?'checked':''}>${l}</label>`).join('')}<p class="footnote">未成年人仅可由监护人同意匿名聚合。审批与真实共享未接入。</p></section><section class="box"><h2>记录节奏与隐私</h2><label class="check-row"><input type="checkbox" data-change="reminders" ${S.settings.reminders?'checked':''}>温和提醒（本地页内模拟）</label><label class="field small">提醒间隔（小时）<input type="number" min="1" max="24" value="${S.settings.interval}" data-change="interval" aria-label="提醒间隔"></label><label class="check-row"><input type="checkbox" data-change="history-lock" ${S.settings.historyLock?'checked':''}>查看历史详情前验证模拟密码</label><p class="footnote">历史锁不影响计时。系统后台通知、跨软件悬浮窗未接入。</p></section></div><section class="box" style="margin-top:24px"><h2>完整免费，按自己的意愿支持</h2><p style="margin:15px 0">比起赞赏，我们更希望你把点亮和“减少管理负担，让实践积累”的理念推荐给身边的人。</p><div class="row">${btn('准备推荐文案','recommend')}${S.habits.some(h=>h.formedAt!==null)?btn('自愿赞赏 2–5 元（模拟）','appreciate','ghost'):''}</div><p class="footnote">不设置付费门槛，不连接真实支付。示例已养成习惯只用于审阅支持入口。</p><details class="saved-notes"><summary>教程外链与收益规则</summary><p>候选抽成约 0.5%，其中一半进入对应节点持有者池，另一半归平台。公共持有者是全部点亮者，私人节点归个人。抽成不影响推荐顺序。</p><div class="table-wrap"><table><thead><tr><th>规则示例 · 非收入</th><th>金额</th><th>状态</th></tr></thead><tbody><tr><td>假设有效订单</td><td>1,000 元</td><td>未发生</td></tr><tr><td>候选抽成 0.5%</td><td>5 元</td><td>演算</td></tr><tr><td>节点持有者池 / 平台</td><td>各 2.5 元</td><td>未结算</td></tr></tbody></table></div><p class="footnote">内部权重、有效点亮、归因窗口、多节点归因、退款、基数与舍入尚待确认。未采用平均分或贡献权重。</p></details></section>`+missingParentPanel()}
function modal(content,cls='',label='操作面板'){const host=$('#dialogs'),old=host.firstElementChild,opener=document.activeElement,returnTo=old?.returnTo||{page:S.page,id:opener?.id,action:opener?.dataset.action};host.innerHTML=`<dialog class="dialog ${cls}" aria-label="${esc(label)}" data-od-id="dialog">${btn('×','dialog-close','dialog-close ghost','aria-label="关闭面板"')}${content}</dialog>`;const d=host.firstElementChild;d.returnTo=returnTo;const heading=d.querySelector('h2');if(heading){heading.id='dialog-heading';heading.tabIndex=-1;if(label==='操作面板'){d.removeAttribute('aria-label');d.setAttribute('aria-labelledby',heading.id)}}bind(d);d.addEventListener('close',()=>{if(host.firstElementChild===d){d.remove();U.reportId=null;let target;if(returnTo.page===S.page){target=returnTo.id?document.getElementById(returnTo.id):null;if(!target&&returnTo.action)target=[...$('#app').querySelectorAll('[data-action]')].find(el=>el.dataset.action===returnTo.action&&el.checkVisibility()&&!el.disabled)}if(!target||!target.checkVisibility()||target.disabled)target=$('#main-content');target?.focus({preventScroll:true})}});d.addEventListener('cancel',ev=>{if(d.querySelector('#method-form')){ev.preventDefault();closeModal()}});d.showModal();const field=[...d.querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=hidden]),textarea,select')].find(el=>!el.disabled&&el.checkVisibility());if(matchMedia('(min-width:701px)').matches&&field)field.focus();else heading?.focus({preventScroll:true});return d}
function closeModal(force=false){const d=$('#dialogs dialog');if(!d)return;const form=d.querySelector('#method-form');if(!force&&form&&form.dataset.initial!==JSON.stringify([...new FormData(form)])){let guard=d.querySelector('#method-close-review');if(!guard){guard=document.createElement('section');guard.id='method-close-review';guard.className='box';guard.setAttribute('aria-label','未保存的教程修改');guard.innerHTML='<p>填写内容尚未保存。继续编辑，或放弃本次修改后关闭。</p><div class="row" style="margin-top:12px">'+btn('继续编辑','method-continue','primary')+btn('放弃修改并关闭','method-discard','ghost')+'</div>';form.append(guard);bind(guard)}guard.querySelector('button').focus();return}d.close()}
function report(e){U.reportId=e.id;modal(`<div class="seal" aria-hidden="true">✓</div><div class="eyebrow muted">这一段，已经留下</div><h2 style="font-size:32px;margin:14px 0">${esc(e.name)}</h2><span class="tag">行动战报 · 模拟操作结果</span>${eventBody(e)}${active()?`<p class="small muted" style="margin-top:20px">${esc(active().name)} 仍在计时，战报不会暂停它。</p>`:''}<div class="row actions">${btn('查看事件记录','report-history')}${e.knowledge?btn('审阅点亮草稿','report-light:'+e.id):''}${btn('完成','dialog-close','primary')}</div>`,'report','行动战报')}
function another(){modal(`<h2>开始另一件事</h2><p class="muted small">当前活动事件会暂停，并保留在未结束列表。</p><form id="another-form" class="stack" style="margin-top:20px"><label class="field">想做的事<input name="name" aria-label="另一件事的名称" list="event-options" required placeholder="搜索或直接输入" maxlength="120"></label><datalist id="event-options">${candidates().map(x=>`<option value="${esc(x.name)}"></option>`).join('')}</datalist><div class="row">${candidates().slice(0,5).map(x=>btn(esc(x.name),'fill-another:'+encodeURIComponent(x.name),'ghost')).join('')}</div><button class="primary">开始另一件事并计时</button></form>`,'','开始另一件事')}
function lightForm(id){const l=S.lights.find(l=>l.id===id);if(!l)return;const k=lightSnapshot(l);modal(`<h2>由你确认，是否点亮</h2><p class="small muted">${esc(lightTitle(l))}${k?.nodeVersion!=null?' · 目标 v'+esc(k.nodeVersion):''}</p><p class="pre">${esc(k?.nodeGoal)||'这条旧记录缺少当时的完整目标，暂不能确认点亮。'}</p><p class="small muted" style="margin:12px 0">计时结束只证明做过，掌握与否由你自证。默认私人。</p><form id="light-form" data-id="${l.id}" class="stack"><label class="field">实践结果<textarea name="result" aria-label="实践结果" required placeholder="做到了什么，或还没有做到什么？">${esc(l.result)}</textarea></label><label class="field">自证 / 证据<textarea name="evidence" aria-label="点亮证据" required placeholder="过程、自己的解释，或作品地址">${esc(l.evidence)}</textarea></label><label class="check-row"><input type="checkbox" name="public">我选择公开此证据（仅本地模拟）</label><label class="check-row"><input type="checkbox" name="confirm" required>我已完成目标，确认留下 L1 自证记录</label><button class="primary" ${k?.nodeGoal?'':'disabled'}>确认点亮</button></form>`,'','确认点亮')}
function showMethodConflict(form,method){$('#method-error').textContent='教程已有新版本，当前草稿未覆盖任何版本。';form.querySelector('#method-conflict-review')?.remove();const v=method.versions.at(-1),panel=document.createElement('section');panel.id='method-conflict-review';panel.className='box';panel.innerHTML=`<details><summary>查看当前已保存的 v${v.number}</summary><h3>${esc(method.title)}</h3><p class="pre small">${esc(v.content)}</p><p class="pre small muted">下一段五分钟：${esc(v.five)}</p>${v.resource?`<p class="pre small muted">资料：${esc(v.resource)}</p>`:''}</details><p class="small muted" style="margin:12px 0">另存会创建私人方法，保留当前填写内容，不修改原教程。</p>${btn('另存为私人方法','method-copy')}`;form.append(panel);bind(panel);panel.querySelector('button').focus()}
function submitMethod(form,copy=false){const f=new FormData(form);if(copy)f.delete('public');form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));for(const [key,label] of [['title','方法名称'],['content','具体步骤'],['five','五分钟行动建议']]){if(!String(f.get(key)||'').trim()){const field=form.elements.namedItem(key);field.setAttribute('aria-invalid','true');$('#method-error').textContent='请填写'+label+'，不能只填空格。';field.focus();return}}const n=node(form.dataset.node);if(!n){$('#method-error').textContent='目标已不存在，填写内容仍在，请先保留内容再选择目标。';return}const existing=copy?null:n.methods.find(m=>m.id===form.dataset.method);if(!copy&&form.dataset.method&&!existing){$('#method-error').textContent='原方法已不存在，填写内容仍在，不能直接覆盖。';return}if(existing&&existing.versions.at(-1).number!==Number(form.dataset.base)){showMethodConflict(form,existing);return}if(f.has('public')&&!S.lights.some(l=>l.nodeId===n.id&&l.confirmed)){$('#method-error').textContent='公开贡献前需要本人先确认点亮。可以取消公开，保存私人草稿。';return}const v={number:(existing?.versions.at(-1).number||0)+1,created:Date.now(),content:f.get('content').trim(),five:f.get('five').trim(),resource:f.get('resource').trim()};const links=methodResourceValues(form);if(links===null)return;if(links.length){if(v.resource){$('#method-error').textContent='原资料文字仍在，请明确转入逐项资料或清空原文字后保存，避免丢失。';return}v.resourceLinks=links}if(!v.content||!v.five)return;if(existing){existing.versions.push(v);existing.title=f.get('title').trim();existing.visibility=f.has('public')?'public':'private'}else n.methods.push({id:uid(),title:f.get('title').trim(),author:S.user.name,visibility:f.has('public')?'public':'private',versions:[v]});closeModal(true);if(save())clearMethodDraft(form);navigate('contribute');toast('方法已本地保存，过去实践的快照保留。')}

function methodVersionBody(v,m=null){return `<section style="margin:16px 0;padding-bottom:16px;border-bottom:1px solid var(--border)"><h3 class="small">${m?.serviceReference?'服务版本 '+esc(m.serviceReference.version):'v'+v.number} · ${dt(v.created)}</h3><p class="pre small">${esc(v.content)}</p><h4 class="small" style="margin-top:12px">当时的五分钟起步</h4><p class="pre small">${esc(v.five)}</p>${typeof reviewSharedResources==='function'?reviewSharedResources(v):methodResourceDisplay(v)}${v.resource?`<p class="pre small">当时资料文字：${esc(v.resource)}</p>`:''}${!v.resource&&!v.resourceLinks?.length?'<p class="small muted">此版本未填写资料。</p>':''}</section>`}
function methodResourceDisplay(v){if(typeof reviewSharedResources==='function'||!Array.isArray(v.resourceLinks))return '';return v.resourceLinks.map(r=>{let safe=false;try{const u=new URL(r.url);safe=['http:','https:'].includes(u.protocol)&&!u.username&&!u.password}catch{}return `<p class="small">${safe?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)}</a>`:esc(r.label)} · ${r.optional?'可选':'需用'}${r.affiliate?' · 分成外链标记':''}</p>`}).join('')}
function methodResourceValues(form){try{const links=JSON.parse(form.elements.namedItem('resourceLinks').value);if(!Array.isArray(links)||links.length>12)throw Error('资料列表格式无效。');for(const link of links){if(!link.label.trim()||link.label.trim().length>80)throw Error('请为每项资料填写名称（最多80字）。');const u=new URL(link.url.trim());if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.href.length>2000)throw Error('资料地址需为不含登录信息的 HTTP 或 HTTPS 链接。')}return links.map(l=>({label:l.label.trim(),url:new URL(l.url.trim()).href,affiliate:!!l.affiliate,optional:!!l.optional}))}catch(error){$('#method-error').textContent=error.message;return null}}
function renderMethodResources(form){const field=form.elements.namedItem('resourceLinks'),links=JSON.parse(field.value),host=form.querySelector('#method-resource-rows');host.innerHTML=links.map((r,i)=>`<fieldset class="stack" style="border:1px solid var(--border);padding:14px;margin-top:12px"><legend>资料 ${i+1}</legend><label class="field">名称<input aria-label="资料 ${i+1} 名称" data-resource-field="label" value="${esc(r.label)}" maxlength="80"></label><label class="field">地址<input aria-label="资料 ${i+1} 地址" data-resource-field="url" value="${esc(r.url)}"></label><label class="check-row"><input type="checkbox" data-resource-field="optional" ${r.optional?'checked':''}>可选材料</label><label class="check-row"><input type="checkbox" data-resource-field="affiliate" ${r.affiliate?'checked':''}>分成产品外链（尚未接入交易）</label><button type="button" class="ghost" aria-label="移除资料 ${i+1}" data-resource-remove="${i}">移除此项</button></fieldset>`).join('');host.querySelectorAll('fieldset').forEach((row,i)=>{row.querySelectorAll('[data-resource-field]').forEach(input=>input.addEventListener('input',()=>{const current=JSON.parse(field.value);current[i][input.dataset.resourceField]=input.type==='checkbox'?input.checked:input.value;field.value=JSON.stringify(current)}));row.querySelector('[data-resource-remove]').addEventListener('click',()=>{const current=JSON.parse(field.value);current.splice(i,1);field.value=JSON.stringify(current);renderMethodResources(form);persistMethodDraft(form)})})}
function methodDraftKey(owner,nodeId,methodId){return KEY+':method-draft:'+JSON.stringify([owner,nodeId,methodId])}
function methodDraftFields(form){return Object.fromEntries(['title','content','five','resource','resourceLinks'].map(key=>[key,form.elements.namedItem(key).value]))}
function clearMethodDraft(form){try{sessionStorage.removeItem(form.dataset.draftKey);return true}catch{return false}}
function methodDraftStorageStatus(form,failed){const status=form.querySelector('#method-draft-status');if(failed){form.dataset.draftFailed='true';if(status)status.textContent='草稿暂存失败，请先导出当前内容，或重试后再刷新。';if(!form.querySelector('#method-draft-recovery')){const tools=document.createElement('div');tools.id='method-draft-recovery';tools.className='row';tools.innerHTML=btn('重试暂存','method-draft-retry')+btn('导出当前草稿','method-draft-export','ghost');form.append(tools);bind(tools)}}else if(form.dataset.draftFailed){delete form.dataset.draftFailed;if(status)status.textContent='';form.querySelector('#method-draft-recovery')?.remove()}}
function persistMethodDraft(form){try{const fields=methodDraftFields(form),initial=Object.fromEntries(JSON.parse(form.dataset.initial).filter(([key])=>key!=='public'));if(JSON.stringify(fields)===JSON.stringify(initial)){const ok=clearMethodDraft(form);methodDraftStorageStatus(form,!ok);return ok}sessionStorage.setItem(form.dataset.draftKey,JSON.stringify({schema:1,owner:form.dataset.owner,node:form.dataset.node,method:form.dataset.method,base:Number(form.dataset.base),fields}));methodDraftStorageStatus(form,false);return true}catch{methodDraftStorageStatus(form,true);return false}}
function restoreMethodDraft(form){try{const raw=sessionStorage.getItem(form.dataset.draftKey);if(!raw)return;const d=JSON.parse(raw);if(d.schema!==1||d.owner!==form.dataset.owner||d.node!==form.dataset.node||d.method!==form.dataset.method||!Number.isInteger(d.base)||d.base<0||!d.fields||['title','content','five','resource'].some(key=>typeof d.fields[key]!=='string'))return;for(const key of ['title','content','five','resource'])form.elements.namedItem(key).value=d.fields[key];form.elements.namedItem('resourceLinks').value=typeof d.fields.resourceLinks==='string'?d.fields.resourceLinks:'[]';renderMethodResources(form);form.dataset.base=d.base;form.querySelector('#method-draft-status').textContent='已恢复此标签页的未保存内容，公开选项需重新选择。'}catch{form.querySelector('#method-draft-status').textContent='暂存草稿无法读取，原暂存内容未覆盖。'}}
function methodForm(n,existing=null){const v=existing?.versions.at(-1);modal(`<h2>${existing?'修订方法 · 新版本':'贡献一个方法'}</h2><p class="small muted" style="margin-bottom:18px">目标：${esc(n.title)}。默认保存为私人；公开前必须先确认点亮。</p><form id="method-form" data-node="${n.id}" data-method="${existing?.id||''}" data-base="${v?.number||0}" class="stack"><label class="field">方法名称<input name="title" aria-label="方法名称" required value="${esc(existing?.title||'')}"></label><label class="field">具体步骤<textarea name="content" aria-label="方法步骤" required>${esc(v?.content||'')}</textarea></label><label class="field">下一段五分钟<input name="five" aria-label="五分钟行动建议" required value="${esc(v?.five||n.five)}"></label><label class="field" ${v?.resource?'':'hidden'}>原资料文字（请核对后迁移到逐项资料）<input name="resource" aria-label="资料或产品地址" value="${esc(v?.resource||'')}"></label><input type="hidden" name="resourceLinks" value="${esc(JSON.stringify(v?.resourceLinks||[]))}"><section id="method-resources"><h3>逐项资料与产品</h3><p class="small muted">标明材料名称及用途。外链分成仅记录意愿，没有真实支付。</p><div id="method-resource-rows"></div><button type="button" id="method-resource-add" class="ghost">＋ 添加资料</button></section><label class="check-row"><input name="public" type="checkbox">主动选择公开模拟（需本人已点亮）</label><button class="primary">${existing?'保存新版本':'保存方法'}</button><p id="method-error" class="error" role="alert"></p></form>`,'','教程贡献');const form=$('#method-form');form.dataset.owner=S.user.id;form.dataset.draftKey=methodDraftKey(S.user.id,n.id,existing?.id||'');form.dataset.initial=JSON.stringify([...new FormData(form)]);const status=document.createElement('p');status.id='method-draft-status';status.className='small muted';status.setAttribute('role','status');form.append(status);renderMethodResources(form);restoreMethodDraft(form);form.querySelector('#method-resource-add').addEventListener('click',()=>{const links=JSON.parse(form.elements.namedItem('resourceLinks').value);if(links.length>=12){$('#method-error').textContent='最多保存十二项资料。';return}links.push({label:'',url:'',affiliate:false,optional:true});form.elements.namedItem('resourceLinks').value=JSON.stringify(links);renderMethodResources(form);persistMethodDraft(form)})}

async function passwordHash(value,salt){if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+value));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(unescape(encodeURIComponent(salt+value)))}

function deleteEventRecord(id){

function validateEventTimeline(events,activeId){
 const byId=new Map(events.map(e=>[e.id,e])),intervals=[];let open=0;
 if(activeId!==null&&!byId.has(activeId))throw Error('当前活动事件不存在');
 for(const e of events){
  if(e.parentId!=null&&(typeof e.parentId!=='string'||!e.parentId))throw Error('父事件引用格式无效');
  if(e.parentStepId!=null&&typeof e.parentStepId!=='string')throw Error('来源步骤引用格式无效');
  if(e.parentMissing!==undefined){const p=e.parentMissing;if(!p||typeof p!=='object'||Array.isArray(p)||typeof p.id!=='string'||!p.id||!(p.stepId===null||typeof p.stepId==='string')||e.parentId!=null||e.parentOrigin!==undefined||Object.keys(p).some(k=>!['id','stepId'].includes(k)))throw Error('缺失来源信息无效')}
  if(e.parentOrigin!==undefined){const p=e.parentOrigin;if(!p||typeof p!=='object'||Array.isArray(p)||typeof p.id!=='string'||!p.id||typeof p.name!=='string'||!(p.stepId===null||typeof p.stepId==='string')||!Number.isFinite(p.deletedAt)||e.parentId!=null||Object.keys(p).some(k=>!['id','name','stepId','deletedAt'].includes(k)))throw Error('已删除父记录的来源信息无效')}
  if(e.endedAt!==null&&e.endedAt<e.startedAt)throw Error('事件结束早于开始');
  let last=e.startedAt;
  for(const [i,p] of e.segments.entries()){
   if(p.start<last)throw Error('活动段倒序或重叠');
   if(p.end===null){if(e.id!==activeId||e.endedAt!==null||i!==e.segments.length-1)throw Error('开放活动段不属于当前事件');open++}
   else if(e.endedAt!==null&&p.end>e.endedAt)throw Error('活动段超出事件结束时间');
   last=p.end===null?Infinity:p.end;
   if(last>p.start)intervals.push({start:p.start,end:last});
  }
 }
 if(open!==(activeId===null?0:1))throw Error('只能有一件事正在累计时间');
 intervals.sort((a,b)=>a.start-b.start);
 for(let i=1;i<intervals.length;i++)if(intervals[i].start<intervals[i-1].end)throw Error('不同事件的实际活动时间重叠');
 const checked=new Set();
 for(const e of events){const visiting=new Set();let id=e.id;while(byId.has(id)&&!checked.has(id)){if(visiting.has(id))throw Error('父事件关系形成循环');visiting.add(id);id=byId.get(id).parentId}for(const id of visiting)checked.add(id)}
}
function validateResourceLinks(links){if(!Array.isArray(links)||links.length>12)throw Error('资料列表需为最多十二项的列表');for(const r of links){if(!r||typeof r!=='object'||Array.isArray(r)||Object.keys(r).some(k=>!['label','url','optional','affiliate'].includes(k))||typeof r.label!=='string'||!r.label.trim()||r.label.length>80||typeof r.url!=='string'||typeof r.optional!=='boolean'||typeof r.affiliate!=='boolean')throw Error('资料名称、地址或标记无效，或包含未知字段');let u;try{u=new URL(r.url)}catch{throw Error('资料地址无效')}if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.href.length>2000)throw Error('资料地址需为不含登录信息的 HTTP 或 HTTPS 链接')}}

 else if(a==='issue-close'){const i=S.issues.find(i=>i.id===id);i.closed=!i.closed;save();render()}
 else if(a==='logout'){pause();snapshotProfile();if(persistError)archiveUnsavedState();S.user=null;S.session=null;save();render()}
 else if(a==='export-broken-profile'){if(failedProfile&&S.user&&failedProfile.ownerId===S.user.id)download('点亮-损坏账户档案副本.json',{format:'dianliang-unreadable-profile/v1',exportedAt:Date.now(),ownerId:S.user.id,data:failedProfile.raw})}
 else if(a==='review-storage')reviewStorage();
 else if(a==='resolve-storage')resolveStorage(id);
 else if(a==='export-recovery'){const archives=recoveryArchives.get(S.user?.id)||[];modal(`<h2>导出旧窗口未保存内容</h2><p class="small muted">仅当前账户可见。备份不含密码，可从账户页审阅后导入。</p>${archives.map((entry,i)=>`<div class="list-row row between"><span>${dt(entry.created)} · ${entry.snapshot.events.length} 条事件</span><div class="row">${btn('下载这份未保存备份','download-recovery:'+i)}${entry.exported?btn('已备份，移除暂存','remove-recovery:'+i,'ghost'):''}</div></div>`).join('')}`)}
 else if(a==='download-recovery'){const entry=recoveryArchives.get(S.user?.id)?.[Number(id)];if(entry){download('点亮-旧窗口未保存备份.json',{format:'dianliang-local-backup/v1',exportedAt:Date.now(),data:portableData(entry.snapshot)});entry.exported=true;handle('export-recovery')}}
 else if(a==='remove-recovery'){const entry=recoveryArchives.get(S.user?.id)?.[Number(id)];if(entry?.exported)modal(`<h2>移除这份页面暂存？</h2><p>请确认下载的备份已妥善保留。只移除此页面的旧暂存，不删除本机事件或备份文件。</p><div class="row actions">${btn('取消','dialog-close')}${btn('确认移除暂存','confirm-remove-recovery:'+id,'danger')}</div>`)}
 else if(a==='confirm-remove-recovery'){const owner=S.user?.id,list=recoveryArchives.get(owner),entry=list?.[Number(id)];if(entry?.exported){list.splice(Number(id),1);if(!list.length)recoveryArchives.delete(owner);closeModal();updateStorageStatus();toast('页面暂存已移除，请妥善保留备份。')}}
 else if(a==='retry-save'){if(save())toast('当前内容已保存到本机。');else toast('仍未保存，请导出当前内容后处理存储问题。')}
 else if(a==='export-data')exportDialog();
 else if(a==='import-data')$('#import-file').click();
 else if(a==='confirm-import'){const restoringProfile=failedProfile&&S.user&&failedProfile.ownerId===S.user.id;const d=clone(window.pendingImport);if(d.events)validateEventTimeline(d.events,d.activeId);for(const l of d.lights||[])l.public=false;for(const n of d.nodes||[])if(n.ownership==='personal')n.visibility='private';for(const n of d.nodes||[])for(const m of n.methods)if(m.author!=='点亮演示内容组')m.visibility='private';for(const p of d.paths||[])if(!p.seed)p.visibility='private';d.share={aggregate:false,individual:false,named:false};Object.assign(S,d);if(!S.habits.length)S.habits=seed().habits;if(!S.habits.some(h=>h.id===S.habitId))S.habitId=S.habits[0].id;loadError='';failedProfile=null;closeModal();normalize();if(restoringProfile)snapshotProfile();save();render();toast('已导入，活动段冻结，私人分享边界已恢复。')}
 else if(a==='recommend'){modal(`<h2>把理念推荐给朋友</h2><p class="pre" style="margin-bottom:20px">点亮：记录我正在做什么、做完了什么。完整免费，减少管理时间的额外负担，把实践连成自己的知识足迹。</p><p class="small muted">可复制以上文字自行分享。这里没有发送给他人，也没有虚构线上产品链接。</p>`)}
 else if(a==='appreciate'){modal(`<h2>谢谢你的心意</h2><p>完整功能始终免费。你可以选择 2–5 元的模拟赞赏意愿，也可以只把理念推荐给别人。</p><div class="row" style="margin-top:24px">${[2,3,5].map(n=>btn(n+' 元 · 记录意愿','appreciation:'+n)).join('')}</div><p class="footnote">没有支付、扣款、到账或结算。</p>`)}
 else if(a==='appreciation'){S.logs.push({type:'appreciation-intent',amount:Number(id),at:Date.now()});save();closeModal();toast('已保存模拟意愿，没有发生付款。')}
 else if(a==='change-password'){if(S.user.example){toast('示例模式没有密码，请注册本地模拟账户。');return}modal(`<h2>修改模拟密码</h2><form id="password-form" class="stack"><label class="field">原密码<input name="old" type="password" aria-label="原密码" required></label><label class="field">新密码<input name="new" type="password" aria-label="新密码" required minlength="4"></label><button class="primary">保存新模拟密码</button><p id="password-error" class="error"></p></form>`)}
 else if(a==='edit-event-note'){const e=S.events.find(e=>e.id===id);modal(`<h2>调整本次单次笔记</h2><form id="event-note-form" data-id="${id}" class="stack">${e.notes.map(n=>`<textarea aria-label="历史笔记" data-note-id="${n.id}">${esc(n.text)}</textarea>`).join('')}<label class="field">补充一条<textarea name="newnote" aria-label="历史补充笔记"></textarea></label><button class="primary">保存本次调整</button></form>`)}
 else if(a==='delete-event')modal(`<h2>删除这一次记录？</h2><p>将删除该事件及其笔记、关联点亮。子事件和计时保留，只留下父记录名称、ID和来源步骤，标明父记录已删除。操作不可撤销，可先从账户页备份。</p><div class="row actions">${btn('取消','dialog-close')}${btn('删除本次模拟记录','confirm-delete:'+id,'danger')}</div>`);
 else if(a==='review-missing-parent')reviewMissingParents();
 else if(a==='confirm-missing-parent')markMissingParents();
 else if(a==='confirm-delete'){if(!deleteEventRecord(id)){toast('只能删除已结束的历史记录。');return}closeModal();save();navigate('records')}
}
function pathEdit(id){const p=S.paths.find(p=>p.id===id);if(!p)return;modal(`<h2>编排我的路径</h2><label class="field">路径名称<input id="path-edit-title" aria-label="编辑路径名称" value="${esc(p.title)}" data-path-id="${p.id}"></label><div style="margin-top:18px">${p.nodes.map((nid,i)=>`<div class="row between list-row"><span>${i+1}. ${esc(node(nid).title)}</span><div class="row">${btn('上移',`path-move:${id}:${i}-up`,'',`aria-label="上移：${esc(node(nid).title)}" ${i===0?'disabled':''}`)}${btn('下移',`path-move:${id}:${i}-down`,'',`aria-label="下移：${esc(node(nid).title)}" ${i===p.nodes.length-1?'disabled':''}`)}${btn('移除',`path-remove:${id}:${i}`,'ghost',`aria-label="从路径移除：${esc(node(nid).title)}"`)}</div></div>`).join('')}</div><div class="row" style="margin-top:16px"><select id="path-add-node" aria-label="添加路径目标">${S.nodes.filter(n=>!p.nodes.includes(n.id)).map(n=>`<option value="${n.id}">${esc(n.title)}</option>`).join('')}</select>${btn('添加所选目标','path-add:'+id)}</div><p class="footnote">顺序只影响自己的路径，不编辑一般事件概率关系。新编排保留本地，公开需再次选择。</p><div class="row actions">${btn('完成编排','path-edit-done:'+id,'primary')}</div>`,'','编排知识路径');$('#path-edit-title').addEventListener('change',ev=>{if(ev.target.value.trim()){p.title=ev.target.value.trim();save()}})}
function bindGraph(){const vp=$('#atlas-viewport');if(!vp)return;let drag=null;vp.onpointerdown=ev=>{if(ev.target.closest('button'))return;drag={x:ev.clientX,y:ev.clientY,left:vp.scrollLeft,top:vp.scrollTop};vp.setPointerCapture(ev.pointerId)};vp.onpointermove=ev=>{if(drag){vp.scrollLeft=drag.left+drag.x-ev.clientX;vp.scrollTop=drag.top+drag.y-ev.clientY}};vp.onpointerup=()=>drag=null;vp.onpointercancel=()=>drag=null;vp.onkeydown=ev=>{if(ev.target!==vp)return;const steps={ArrowRight:[80,0],ArrowLeft:[-80,0],ArrowDown:[0,80],ArrowUp:[0,-80]};if(steps[ev.key]){ev.preventDefault();vp.scrollBy(...steps[ev.key])}}}
setInterval(()=>{if(S.activeId){const e=active();if(e){const value=clock(elapsed(e));document.querySelectorAll('[data-clock]').forEach(el=>{if(el.dataset.clock===e.id&&el.textContent!==value)el.textContent=value})}};if(S.settings.reminders&&S.user&&Date.now()-(S.settings.lastReminder||0)>S.settings.interval*3600000){S.settings.lastReminder=Date.now();save();toast('如果愿意，可以记录一下现在正在做的事。')}},500);
window.addEventListener('beforeunload',ev=>{const form=$('#method-form'),draftOk=!form||persistMethodDraft(form);if(!save()||!draftOk||[...recoveryArchives.values()].some(list=>list.length)){ev.preventDefault();ev.returnValue=''}});window.addEventListener('storage',ev=>{if(ev.key===KEY){try{const n=JSON.parse(ev.newValue);if(n){validateSavedState(n);const page=S.page,sessionChanged=S.user?.id!==n.user?.id||S.session!==n.session;if(persistError&&!sessionChanged){persistError='另一个窗口已有更新，当前编辑已保留，请重试保存；冲突时可核对。';updateStorageStatus();return}if(sessionChanged){if(persistError)archiveUnsavedState();if(failedProfile&&failedProfile.ownerId!==n.user?.id){failedProfile=null;loadError=''}closeModal(true);persistError='';storageReview=null}S=n;lastStored=ev.newValue;if(!sessionChanged)S.page=page;window.dianliangState=S;render(false);updateStorageStatus()}}catch{toast('另一个标签的存储无法读取，当前内容保留。')}}});
normalize();render();updateStorageStatus();
</script>
</body></html>
