(() => {
'use strict';

const timerRows=[];let selectedTimer=null;
let currentHabit={id:'mock-reading-habit',name:'阅读一节教程'};
const formedHabits=[{id:'demo-walk',name:'晨间散步',formedAt:Date.now()-86400000,demo:true}];
let habits=[currentHabit],newHabitOpen=false,detailHabitId=null,detailEventId=null;
let historyRange='all',historyDate=new Date().toLocaleDateString('en-CA');
const runtimeKey='dianliang-prototype-runtime-v1';
try{const stored=JSON.parse(localStorage.getItem(runtimeKey)||'null');if(stored&&Array.isArray(stored.rows)){timerRows.push(...stored.rows);currentHabit=stored.habit||currentHabit;if(Array.isArray(stored.formed))formedHabits.splice(0,formedHabits.length,...stored.formed);for(const pair of stored.notes||[])previewNotes.set(...pair);for(const pair of stored.steps||[])stepTemplates.set(...pair);selectedTimer=selectedRow()?.id||null;if(Array.isArray(stored.habits)&&stored.habits.length)habits=stored.habits;currentHabit=habits.find(h=>h.id===currentHabit.id)||habits[0];}}catch{}

function dateKey(ms){const day=new Date(ms);return [day.getFullYear(),String(day.getMonth()+1).padStart(2,'0'),String(day.getDate()).padStart(2,'0')].join('-');}
function updateFormedHabits(){for(const habit of habits.filter(h=>h.id===currentHabit.id)){if(formedHabits.some(h=>h.id===habit.id))continue;const days=new Set(timerRows.filter(r=>r.habitId===habit.id&&r.ended!==null).map(r=>dateKey(r.ended)));const today=new Date();today.setHours(0,0,0,0);const counts=[0,0,0,0];for(let age=0;age<28;age++){const day=new Date(today);day.setDate(day.getDate()-age);if(days.has(dateKey(day)))counts[Math.floor(age/7)]++;}if(counts.every(n=>n>=5))formedHabits.unshift({...habit,formedAt:Date.now()});}}
function appendHistoryRecord(parent,row){

}

 for(const habit of formedHabits){const fold=document.createElement('details');fold.style.marginTop='10px';const summary=document.createElement('summary');summary.textContent=habit.name+(habit.demo?'（示例）':'')+' · '+dateKey(habit.formedAt);fold.append(summary);const info=document.createElement('p');info.textContent=habit.demo?'模拟养成：连续四周，每周实践五天。':'连续四周，每周至少五个实践日。';fold.append(info);const rows=timerRows.filter(r=>r.habitId===habit.id&&r.ended!==null);if(!rows.length){const empty=document.createElement('p');empty.textContent=habit.demo?'这是养成后的展示示例，未混入你的事件历史。':'暂无事件记录';fold.append(empty);}rows.forEach(r=>appendHistoryRecord(fold,r));const view=document.createElement('button');view.textContent='查看习惯详情';view.setAttribute('aria-label','查看习惯详情：'+habit.name);view.onclick=()=>{detailHabitId=habit.id;navigate('details-read');};fold.append(view);block.append(fold);}

function selectedRow(){return timerRows.find(r=>r.started!==null&&r.ended===null);}
function stopInterval(row,now){if(row.started!==null){row.segments.push({started:row.started,ended:now});row.elapsed+=now-row.started;row.started=null;}}

function addTimer(name,elapsed=0){const now=Date.now();const row={id:uid(),name,started:null,ended:null,elapsed:elapsed*1000,segments:[],note:'',stepDone:{}};timerRows.unshift(row);activateTimer(row);return row;}
function ensureTimers(){if(timerRows.length||!screenId.startsWith('running-'))return;if(screenId==='running-stack'){addTimer('吃东西',756);addTimer('喝水',188);addTimer('打游戏',80);}else addTimer(screenId==='running-write'?'写作':'阅读一节教程',756);}
function duration(row){const seconds=Math.floor((row.elapsed+(row.started===null?0:Date.now()-row.started))/1000);return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':');}

function valid(p){
 if(!p||p.format!=='editable-prototype/v1'||typeof p.id!=='string'||!p.id||typeof p.title!=='string'||!Array.isArray(p.screens)||!p.screens.length||p.screens.length>40||!Number.isFinite(p.width)||p.width<240||p.width>1600||!Number.isFinite(p.height)||p.height<320||p.height>2400)throw Error('不是有效的交互原型文件');
 const ids=new Set();for(const s of p.screens){if(typeof s.id!=='string'||!s.id||ids.has(s.id)||typeof s.name!=='string'||!Array.isArray(s.elements)||s.elements.length>200)throw Error('页面格式或编号有误');ids.add(s.id);const eids=new Set();for(const e of s.elements){if(typeof e.id!=='string'||!e.id||eids.has(e.id)||!['text','button','input','card'].includes(e.type)||typeof e.text!=='string'||e.text.length>1000||!['x','y','w','h'].every(k=>Number.isFinite(e[k]))||e.x<0||e.y<0||e.w<20||e.h<20||e.x+e.w>p.width||e.y+e.h>p.height||(e.target&&typeof e.target!=='string'))throw Error('元素格式或位置有误');eids.add(e.id);}}
 if(!ids.has(p.startScreen)||p.screens.some(s=>s.elements.some(e=>e.target&&!ids.has(e.target))))throw Error('存在指向不存在页面的跳转');return p;
}

  const text = typeof raw.text === 'string' ? raw.text.trim() : '';
  if (!text) return null;
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id : uid(),
    screenId: typeof raw.screenId === 'string' ? raw.screenId : '',

function normalizePayload(payload) {

  }
  const open = comments.filter((c) => !c.resolved).length;
  $('cm-count').textContent = open ? open + ' 条未处理 / 共 ' + comments.length + ' 条' : '共 ' + comments.length + ' 条';
  const trigger = $('cm-open');
  trigger.textContent = open ? '批注 ' + open : '批注';
  trigger.className = open ? 'open' : '';
  decorate();
}

async function persist() {
  renderList();
  if (serverMode) {
    try {
      const response = await fetch('/api/comments', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload()) });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      say('已写入 comments.json');
      return;
    } catch (error) {
      say('写文件失败，改存浏览器草稿：' + error.message);
    }
  } else {
    say('已存浏览器草稿（离线模式不写文件）');
  }
  try { localStorage.setItem(localKey, JSON.stringify(comments)); } catch (error) { say('浏览器草稿也存不下：' + error.message); }
}

function locate(comment) {
  const screens = (project && project.screens) || [];
  const index = screens.findIndex((s) => s.id === comment.screenId);
  const buttons = screensBox ? Array.from(screensBox.querySelectorAll('button')) : [];
  if (index >= 0 && buttons[index]) buttons[index].click();
  if (!comment.elementId) return;
  setTimeout(() => {
    const block = stage && stage.querySelector('[data-element-id="' + attr(comment.elementId) + '"]');
    if (!block) return;
    block.classList.add('cm-flash');
    setTimeout(() => block.classList.remove('cm-flash'), 1700);
  }, 40);
}

async function add() {
  const box = $('cm-text');
  const text = box.value.trim();
  if (!text) { say('先写批注内容。'); box.focus(); return; }
  const target = currentTarget();
  comments.push({
    id: uid(),
    screenId: target.screenId,
    elementId: target.elementId,
    elementText: target.elementText,
    text,
    resolved: false,
    createdAt: Date.now(),
    author: ''
  });
  box.value = '';
  pageOnly = false;
  renderTarget();
  await persist();
  say((serverMode ? '已写入 comments.json：' : '已添加（只存浏览器草稿，未写文件）：') + (target.screenName || '未命名页面') + ' · ' + (target.elementText || '整页'));
}

function markdown() {
  const open = comments.filter((c) => !c.resolved);
  const done = comments.filter((c) => c.resolved);
  const line = (c) => {
    const screen = ((project && project.screens) || []).find((s) => s.id === c.screenId);
    const where = (screen ? screen.name : c.screenId || '未知页面') + ' · ' + (c.elementText || (c.elementId ? c.elementId : '整页'));
    return '- [' + where + '] ' + c.text.replace(/\n/g, ' ') + '（' + new Date(c.createdAt).toLocaleString('zh-CN') + '）';
  };
  const out = ['# 交互原型批注 · ' + ((project && project.title) || '未命名原型'), ''];
  out.push('未处理 ' + open.length + ' 条，已处理 ' + done.length + ' 条。', '', '## 未处理');
  out.push(open.length ? open.map(line).join('\n') : '（无）');
  out.push('', '## 已处理');
  out.push(done.length ? done.map(line).join('\n') : '（无）');
  return out.join('\n') + '\n';
}

function download(name, content) {
  const url = URL.createObjectURL(new Blob([content], { type: 'text/markdown' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function setOpen(open) {
  document.body.classList.toggle('cm-open', open);
  $('cm-open').setAttribute('aria-expanded', open ? 'true' : 'false');
  panel.setAttribute('aria-hidden', open ? 'false' : 'true');
  if (open) { renderTarget(); renderList(); }
}

$('cm-open').onclick = () => setOpen(!document.body.classList.contains('cm-open'));
$('cm-close').onclick = () => setOpen(false);
$('cm-add').onclick = add;
$('cm-page').onclick = () => { pageOnly = !pageOnly; renderTarget(); };
$('cm-export').onclick = () => { download('comments.md', markdown()); say('已导出 Markdown。'); };
$('cm-reload').onclick = async () => { project = await loadProject(); comments = await loadComments(); renderList(); renderTarget(); say('已重新读取。'); };
$('cm-text').onkeydown = (event) => { if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); add(); } };

if (stage) {
  new MutationObserver(() => { decorate(); renderTarget(); }).observe(stage, { childList: true, subtree: true });
  stage.addEventListener('click', () => setTimeout(renderTarget, 0), true);
}
if (screensBox) screensBox.addEventListener('click', () => setTimeout(() => { pageOnly = false; renderTarget(); renderList(); }, 0), true);

(async function init() {
  project = await loadProject();
  comments = await loadComments();
  if (!serverMode) {
    const hint = panel.querySelector('.cm-hint');
    if (hint) hint.textContent = '离线打开：批注只存这份浏览器草稿，不写文件。写完用「导出 Markdown」交给实现方。';
  }
  renderList();
  renderTarget();
  say(serverMode ? '批注写入 comments.json' : '离线模式：只存浏览器草稿，可导出 Markdown');
})();
})();
</script></body></html>
