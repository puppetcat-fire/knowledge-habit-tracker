    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="has-rail">
    <a class="skip-link" href="#main">跳到内容</a>
    <aside class="site-rail" aria-label="站点导航">
      <a class="rail-brand" href="/"><span class="rail-mark" aria-hidden="true">◐</span><span>humansneeds<span class="rail-dot">.</span>com</span></a>
      <nav class="rail-nav" aria-label="站点页面">
        <a href="/habit/">时间与习惯</a>
        <a href="/platform/">点亮知识</a>
        <a href="/wants/">我的想要</a>
        <a href="/demand-graph/" aria-current="page">公开需求图谱</a>
        <a href="/needs/">INeedThis 历史图谱</a>
      </nav>
    </aside>
    <header class="site-header">
      <a class="brand" href="/" aria-label="humansneeds 首页"><span class="brand-mark" aria-hidden="true">◐</span><span class="brand-text">humansneeds<span class="brand-dot">.</span>com</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="/habit/">时间与习惯</a>
        <a href="/platform/">点亮知识</a>

        <a href="/demand-graph/" aria-current="page">公开需求</a>
        <a href="/needs/">历史图谱</a>
      </nav>
    </header>
    <main id="main" class="wants-main">
      <header class="hero page-hero">
        <h1>公开需求图谱</h1>
        <p class="lead">看看大家在做什么、还缺什么，哪些教程和办法能帮上忙。</p>
      </header>
      <form id="graph-search" class="wants-form">
        <label>搜索需求<input name="q" type="search" maxlength="120" placeholder="用途、商品或教程名称" /></label>
        <div class="wants-actions">
          <button class="button primary">搜索</button>
          <a href="/demand-graph/">全部需求</a>
        </div>
      </form>
      <p id="graph-status" role="status">正在读取公开需求…</p>
      <div id="graph-results"></div>
      <section aria-labelledby="graph-tutorials-title">
        <h2 id="graph-tutorials-title">浏览教程</h2>
        <ul id="graph-tutorials" class="wants-list"></ul>
      </section>
    </main>
    <script src="/demand-graph/graph.js" defer></script>
